<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda del día</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .info {
            margin: 20px 0;
            line-height: 1.6;
            color: #444;
        }
        .box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .turno {
            padding: 10px 0;
            border-bottom: 1px solid #e1e5ea;
        }
        .turno:last-child {
            border-bottom: none;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>Agenda del día</h2>

    <p class="info">
        Hola Dr/a. <strong th:text="${nombreMedico}">Médico</strong>,  
        estos son sus turnos para el día
        <strong th:text="${fecha}">01/01/2026</strong>.
    </p>

    <div class="box">

        <div class="turno" th:each="t : ${turnos}">
            <p><strong>Hora:</strong> <span th:text="${#temporals.format(t.hora,'HH:mm')}"></span></p>
            <p><strong>Paciente:</strong> <span th:text="${t.paciente.nombre}"></span></p>
            <p th:if="${t.motivo != null}">
                <strong>Motivo:</strong> <span th:text="${t.motivo}"></span>
            </p>
        </div>

        <p th:if="${#lists.isEmpty(turnos)}">
            No tiene turnos asignados para este día.
        </p>

    </div>

    <div class="footer">
        <p>Este es un mensaje automático. Por favor no responda este correo.</p>
    </div>

</div>
</body>
</html>
